<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Homunculus</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧫</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,500;0,700;1,500&family=Alegreya+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2ea;--ink:#20302a;--dim:#76897d;--verd:#3e8e7e;--line:#d5e0d4;--card:#fbfdfa}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'Alegreya Sans',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:46px 16px 64px}
h1{font-family:'Alegreya',serif;font-size:36px;font-weight:700;letter-spacing:2px}
.sub{font-family:'Alegreya',serif;font-style:italic;color:var(--dim);font-size:15px;margin-top:5px}
#flask{width:min(340px,86vw);margin:26px 0 8px;background:linear-gradient(#e8f4f0,#cfe7e0 65%,#bcd9d0);border:1.5px solid #a9c6bc;border-radius:48% 48% 46% 46% / 30% 30% 62% 62%;padding:34px 20px 24px;text-align:center;box-shadow:inset 0 -18px 34px rgba(62,142,126,.16),0 12px 26px rgba(32,48,42,.1)}
#creature{font-size:56px;min-height:70px;line-height:1.2}
#vitals{margin-top:12px;font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;color:#4a6b60}
#vitals b{color:var(--verd);margin:0 2px}
#ings{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:min(520px,94vw);margin-top:20px}
#ings button{cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:9px 16px;font-family:inherit;font-size:13px;color:var(--ink);transition:all .15s}
#ings button:hover{border-color:var(--verd);color:var(--verd)}
#row{margin-top:16px}
#stir{cursor:pointer;padding:14px 30px;border-radius:999px;border:none;background:var(--verd);color:#fff;font-family:inherit;font-size:12.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;transition:background .15s}
#stir:hover{background:#337768}
#msg{margin-top:18px;font-family:'Alegreya',serif;font-style:italic;font-size:14.5px;color:var(--dim);max-width:480px;text-align:center;line-height:1.65}
</style>
</head>
<body>
<h1>Homunculus</h1>
<div class="sub">an alchemist's flask. grow a little guy.</div>
<div id="flask">
  <div id="creature">🧫</div>
  <div id="vitals">Stage <b id="stage">MURK</b> &middot; Essence <b id="ess">0</b> &middot; Stability <b id="stab">50</b>%</div>
</div>
<div id="ings"></div>
<div id="row"><button id="stir">Stir the flask</button></div>
<div id="msg">add ingredients, then stir. essence raises the stage; low stability melts the little guy.</div>
<script>
const INGS=[['🧂 Salt of the Earth',8,-2],['🌿 Mandrake Root',14,-8],['🍄 Whispering Fungus',18,-12],['🕯️ Saint\'s Candle',10,6],['🪨 Philosopher\'s Gravel',22,-18],['🍯 First Honey',9,3],['⚗️ Quicksilver',26,-25],['🫀 Courage Extract',16,-6]];
const STAGES=['MURK','BLOB','WIGGLER','CRAWLER','LITTLE GUY','HOMUNCULUS'];
const EMOJI=['🧫','🫧','🦠','🐛','👶','🧙'];
let ess=0,stab=50,stirred=0,done=false;
const $=id=>document.getElementById(id);
const box=$('ings');
INGS.forEach((g,i)=>{
  const b=document.createElement('button');b.textContent=g[0];
  b.onclick=()=>{if(done)return;ess+=g[1];stab=Math.max(0,stab+g[2]);$('msg').textContent=g[0]+' added. +'+(g[1])+' essence, '+(g[2]<0?'':'+')+g[2]+' stability.';render();};
  box.appendChild(b);
});
function stage(){return STAGES[Math.min(5,Math.floor(ess/40))];}
function render(){
  $('stage').textContent=stage();$('ess').textContent=ess;$('stab').textContent=stab;
  $('creature').textContent=EMOJI[Math.min(5,Math.floor(ess/40))];
  $('creature').style.transform='scale('+(1+ess/300)+')';
}
$('stir').onclick=()=>{
  if(done)return;
  stirred++;
  stab=Math.max(0,stab-8);
  ess+=5;
  if(stab<=0){
    done=true;
    $('creature').textContent='💀';
    $('msg').textContent='The flask cracks. The almost-guy sighs once and returns to the periodic table. Stirred '+stirred+' times, reached '+stage()+'.';
    return;
  }
  if(ess>=200){
    done=true;
    $('creature').textContent='🧙';
    $('msg').textContent='IT OPENS ITS EYES. It calls you "father/mother/alchemist" and asks what taxes are. A perfect homunculus in '+stirred+' stirs.';
    return;
  }
  const quips=['it bubbles meaningfully','a small hand presses the glass','the murk swirls with intent','something in there just giggled','the essence thickens'];
  $('msg').textContent=quips[Math.floor(Math.random()*quips.length)];
  render();
};
render();
</script>
</body>
</html>
